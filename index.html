<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Primeverse by KyutaXdefstr // Digital Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
                    colors: {
                        theme: {
                            accent: 'rgb(var(--color-accent) / <alpha-value>)', 
                            purple: '#3b82f6',
                            pink: '#ec4899',
                            dark: '#070b14',
                            card: '#0f172a'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        :root { --color-accent: 59 130 246; }
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #070b14; 
            color: #f3f4f6; 
            overflow-x: hidden; 
            -webkit-tap-highlight-color: transparent;
        }
        
        .solid-card { background: #0f172a; border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
        .solid-nav { background: #070b14; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #070b14; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
        
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-theme-accent selection:text-black">

    <nav class="solid-nav sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <div class="flex items-center space-x-4">
                    <button id="hamburger-btn" type="button" class="text-theme-accent hover:text-white p-2.5 rounded-xl bg-white/5 border border-white/10 transition hover:bg-white/10 focus:outline-none cursor-pointer">
                        <i class="fa-solid fa-bars-staggered text-xl"></i>
                    </button>
                    <div class="flex items-center space-x-3 cursor-pointer group" onclick="window.navigateTo(window.state.appUser ? 'store' : 'user-login')">
                        <div id="navbar-logo-icon-container" class="w-10 h-10 rounded-xl bg-theme-accent flex items-center justify-center text-white font-black text-xl transition-transform group-hover:scale-105 overflow-hidden shadow-md">
                            <i class="fa-solid fa-cube"></i>
                        </div>
                        <span class="logo-text-display text-xl font-extrabold tracking-wider text-white uppercase">
                            Primeverse by KyutaXdefstr
                        </span>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div id="sidebar-overlay" class="fixed inset-0 bg-black/90 z-[60] hidden opacity-0 transition-opacity duration-300"></div>
    <div id="sidebar" class="fixed top-0 left-0 h-full w-72 sm:w-80 bg-theme-card z-[70] transform -translate-x-full transition-transform duration-300 flex flex-col border-r border-white/10 shadow-2xl overflow-y-auto"></div>

    <main id="app-container" class="flex-grow max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8 relative z-10 fade-in">
        <div class="flex flex-col items-center justify-center h-64">
            <div class="w-12 h-12 border-4 border-theme-accent border-t-transparent rounded-full animate-spin mb-4"></div>
            <h2 class="text-center text-gray-300 text-lg font-bold tracking-wider">Memuat Sistem...</h2>
        </div>
    </main>

    <footer class="solid-nav py-8 mt-auto relative z-10 border-t border-white/10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row justify-between items-center gap-6">
            <div class="text-center md:text-left">
                <div class="flex items-center justify-center md:justify-start space-x-3 mb-2">
                    <span class="logo-text-display text-lg font-extrabold text-white tracking-wider uppercase">Primeverse by KyutaXdefstr</span>
                </div>
                <p class="text-xs text-gray-500">&copy; 2026 <span class="logo-text-display uppercase">DigiStore</span>. All rights reserved.</p>
            </div>
            
            <div class="flex items-center space-x-3">
                <a href="#" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-xl transition flex items-center space-x-2 text-sm font-bold shadow-md">
                    <i class="fa-brands fa-whatsapp text-lg"></i> <span class="hidden sm:inline">WhatsApp CS</span>
                </a>
                <a href="#" class="bg-white/5 hover:bg-white/10 text-gray-300 hover:text-white p-2.5 rounded-xl transition border border-white/10"><i class="fa-brands fa-instagram text-lg w-5 text-center"></i></a>
                <a href="#" class="bg-white/5 hover:bg-white/10 text-gray-300 hover:text-white p-2.5 rounded-xl transition border border-white/10"><i class="fa-brands fa-tiktok text-lg w-5 text-center"></i></a>
            </div>
        </div>
    </footer>

    <div id="toast-container" class="fixed bottom-6 right-6 z-[100] flex flex-col space-y-2 pointer-events-none"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, onSnapshot, collection, updateDoc, deleteDoc, addDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        let appId = typeof __app_id !== 'undefined' ? __app_id : 'digistore-v3';
        let firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};

        // ===================== api_pakasir =====================
        // IMPORTANT: never put the Pakasir API key in this HTML.
        // The browser talks to your own backend endpoint, which keeps the secret server-side.
        const api_pakasir = Object.freeze({
            baseUrl: '/api/api_pakasir',
            createPath: '/create-transaction',
            statusPath: '/status',
            fulfillPath: '/fulfill-order',
            method: 'qris'
        });
        window.api_pakasir = api_pakasir;
        
        let app, db, auth, userId = null, isDbConnected = false;

        const defaultSettings = {
            logoText: "Primeverse by KyutaXdefstr",
            logoIcon: "", 
            bannerTitle: "Primeverse by KyutaXdefstr",
            bannerDesc: "Layanan otomatis 24/7. Transaksi secepat kilat, bergaransi resmi, dan jaminan aman 100%.",
            themeColor: "#3b82f6", 
            bannerImage: "https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=1200&auto=format&fit=crop",
            snkText: "1. Pengiriman Instan\nData akun dikirim otomatis setelah verifikasi sukses.\n\n2. Ketentuan Garansi\nGaransi hangus apabila pembeli melanggar aturan platform."
        };

        const state = {
            currentView: 'user-login',
            appUser: JSON.parse(localStorage.getItem('primeverse_user') || 'null'),
            adminSubView: 'products',
            isAdmin: false,
            registeredUsers: [],
            checkoutItem: null,
            products: [],
            userOrders: [],
            promoCodes: [],
            activePromo: null,
            searchQuery: '',
            settings: JSON.parse(localStorage.getItem('primeverse_settings')) || { ...defaultSettings }
        };

        window.state = state;

        window.formatRp = (angka) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);
        window.escapeHtml = (value) => String(value ?? '').replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[c]));
        window.formatDate = (isoString) => new Date(isoString).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute:'2-digit' });
        window.hexToRgbString = (hex) => {
            let r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
            return `${r} ${g} ${b}`;
        };

        window.showToast = (message, type = 'success') => {
            const toastContainer = document.getElementById('toast-container');
            if(!toastContainer) return;
            const toast = document.createElement('div');
            const bg = type === 'success' ? 'bg-blue-600 text-white' : 'bg-red-600 text-white';
            toast.className = `${bg} px-5 py-3 rounded-xl shadow-2xl font-bold transform transition-all duration-300 translate-y-10 opacity-0 flex items-center space-x-3 pointer-events-auto border border-white/20`;
            toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-check-circle' : 'fa-triangle-exclamation'} text-lg"></i> <span>${message}</span>`;
            toastContainer.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-10', 'opacity-0'), 10);
            setTimeout(() => { toast.classList.add('translate-y-10', 'opacity-0'); setTimeout(() => toast.remove(), 300); }, 3000);
        };

        window.updateStaticUI = () => {
            document.querySelectorAll('.logo-text-display').forEach(el => el.innerHTML = state.settings.logoText || "Primeverse by KyutaXdefstr");
            if (state.settings.themeColor) {
                document.documentElement.style.setProperty('--color-accent', window.hexToRgbString(state.settings.themeColor));
            }
            const logoContainer = document.getElementById('navbar-logo-icon-container');
            if (logoContainer) {
                if (state.settings.logoIcon && state.settings.logoIcon.trim() !== '') {
                    logoContainer.innerHTML = `<img src="${state.settings.logoIcon}" class="w-full h-full object-cover" onerror="this.innerHTML='<i class=\'fa-solid fa-cube\'></i>'">`;
                } else {
                    logoContainer.innerHTML = `<i class="fa-solid fa-cube"></i>`;
                }
            }
        };

        const initApp = async () => {
            const saved = new URLSearchParams(location.search);
            if (saved.get("order") && saved.get("token")) {
                await window.loadSavedOrder();
                return;
            }
            window.updateStaticUI();
            
            // Hamburger menu safe listeners
            const hamburgerBtn = document.getElementById('hamburger-btn');
            const overlay = document.getElementById('sidebar-overlay');
            if (hamburgerBtn) {
                hamburgerBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    window.toggleSidebar();
                });
            }
            if (overlay) {
                overlay.addEventListener('click', () => {
                    window.toggleSidebar();
                });
            }

            try {
                if (Object.keys(firebaseConfig).length === 0) {
                    const cfgResponse = await fetch('/api/public-config', { credentials: 'same-origin' });
                    if (!cfgResponse.ok) throw new Error("Firebase config missing");
                    const cfg = await cfgResponse.json();
                    appId = cfg.appId || appId;
                    firebaseConfig = cfg.firebaseConfig || {};
                }
                if (Object.keys(firebaseConfig).length === 0) throw new Error("Firebase config missing");
                app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                isDbConnected = true;
                setupRealtimeListeners();
                onAuthStateChanged(auth, async (firebaseUser) => {
                    if (!firebaseUser) {
                        state.appUser = null;
                        state.isAdmin = false;
                        userId = null;
                        if (state.currentView !== 'user-register') window.navigateTo('user-login');
                        return;
                    }
                    userId = firebaseUser.uid;
                    const profileSnap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'registered_users', firebaseUser.uid));
                    const profile = profileSnap.exists() ? profileSnap.data() : { username: firebaseUser.email.split('@')[0], email: firebaseUser.email };
                    state.appUser = { uid: firebaseUser.uid, email: firebaseUser.email, ...profile };
                    const token = await firebaseUser.getIdTokenResult();
                    state.isAdmin = token.claims.admin === true;
                    localStorage.setItem('primeverse_user', JSON.stringify(state.appUser));
                    if (state.currentView === 'user-login' || state.currentView === 'user-register') window.navigateTo('store');
                });
            } catch (error) {
                isDbConnected = false;
                loadDemoData();
                routeInitial();
            }
        };

        const loadDemoData = () => {
            state.products = [
                { id: '1', name: 'Netflix Premium 4K 1 Bulan', price: 45000, image: '', description: 'Akun Netflix legal 4K UHD Ultra HD', stock: ['demo1@mail.com:pass1', 'demo2@mail.com:pass2'] },
                { id: '2', name: 'Spotify Premium 1 Bulan', price: 15000, image: '', description: 'Individual plan legal anti ad', stock: ['spot1@mail.com:pass'] },
                { id: '3', name: 'Canva Pro 1 Tahun', price: 25000, image: '', description: 'Invite team link resmi', stock: [] }
            ];
            state.registeredUsers = [];
            // Security: no admin credentials are shipped in the browser.
            state.promoCodes = [{ id: '1', code: 'DISKON10', type: 'percent', value: 10 }];
            routeInitial();
        };

        const setupRealtimeListeners = () => {
            if (!isDbConnected) return;
            const handleFsError = () => {
                if(isDbConnected) {
                    isDbConnected = false;
                    loadDemoData();
                }
            };

            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'site_config'), (snapshot) => {
                snapshot.forEach(docSnap => {
                    if (docSnap.id === 'settings') {
                        state.settings = { ...defaultSettings, ...docSnap.data() };
                        localStorage.setItem('primeverse_settings', JSON.stringify(state.settings));
                        window.updateStaticUI();
                    }
                });
                const appContainer = document.getElementById('app-container');
                if (appContainer && appContainer.innerHTML.includes('Memuat Sistem')) routeInitial();
            }, handleFsError);

            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'products'), (snapshot) => {
                const list = [];
                snapshot.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
                state.products = list;
                if (state.currentView === 'admin-dashboard' && state.adminSubView === 'products') window.renderAdminDashboard();
                else if (state.currentView === 'store') window.renderStore();
            }, handleFsError);

            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'registered_users'), (snapshot) => {
                const list = [];
                snapshot.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
                state.registeredUsers = list;
            }, handleFsError);

            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'promo_codes'), (snapshot) => {
                const list = [];
                snapshot.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
                state.promoCodes = list;
            }, handleFsError);

            if(userId) {
                onSnapshot(collection(db, 'artifacts', appId, 'users', userId, 'orders'), (snapshot) => {
                    const list = [];
                    snapshot.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
                    state.userOrders = list.sort((a, b) => new Date(b.date) - new Date(a.date));
                    if(state.currentView === 'history') window.renderHistory();
                }, handleFsError);
            }
        };

        const routeInitial = () => {
            if (auth && auth.currentUser) window.navigateTo('store');
            else window.navigateTo('user-login');
        };

        window.navigateTo = (view, payload = null) => {
            if (!state.appUser && !['user-login', 'user-register'].includes(view)) {
                view = 'user-login';
            }
            if (view === 'admin-dashboard') view = 'store';

            state.currentView = view;
            
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            if(sidebar) sidebar.classList.add('-translate-x-full');
            if(overlay) { overlay.classList.remove('opacity-100'); overlay.classList.add('opacity-0'); setTimeout(() => overlay.classList.add('hidden'), 300); }

            const app = document.getElementById('app-container');
            if(app) {
                app.classList.remove('fade-in');
                void app.offsetWidth;
                app.classList.add('fade-in');
            }

            switch(view) {
                case 'store': window.renderStore(); break;
                case 'profile': window.renderProfile(); break;
                case 'history': window.renderHistory(); break;
                case 'snk': window.renderSnK(); break;
                case 'checkout': window.renderCheckout(payload); break;
                case 'qris': window.renderQris(payload); break;
                case 'success': window.renderSuccess(payload); break;
                case 'admin-dashboard': window.renderAdminDashboard(); break;
                case 'user-login': window.renderUserLogin(); break;
                case 'user-register': window.renderUserRegister(); break;
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.toggleSidebar = () => {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            if (!sidebar || !overlay) return;

            if (sidebar.classList.contains('-translate-x-full')) {
                sidebar.innerHTML = window.renderSidebarMenu();
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
                setTimeout(() => overlay.classList.remove('opacity-0'), 10);
                setTimeout(() => overlay.classList.add('opacity-100'), 10);
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.remove('opacity-100');
                overlay.classList.add('opacity-0');
                setTimeout(() => overlay.classList.add('hidden'), 300);
            }
        };

        window.logoutUser = async () => {
            try { if (auth) await signOut(auth); } catch (e) { console.warn(e); }
            state.appUser = null;
            state.isAdmin = false;
            localStorage.removeItem('primeverse_user');
            localStorage.removeItem('primeverse_is_admin');
            window.showToast("Berhasil keluar dari akun", "success");
            window.navigateTo('user-login');
        };

        window.renderSidebarMenu = () => {
            if (!state.appUser) {
                return `
                    <div class="p-6 border-b border-white/10 flex justify-between items-center bg-black/20">
                        <span class="text-lg font-bold text-white tracking-wide">Navigasi</span>
                        <button onclick="window.toggleSidebar()" class="text-gray-400 hover:text-white p-2 focus:outline-none"><i class="fa-solid fa-xmark text-xl"></i></button>
                    </div>
                    <div class="flex-grow py-6 flex flex-col space-y-2 px-4">
                        <button onclick="window.navigateTo('user-login');" class="text-left px-4 py-3 rounded-xl text-gray-300 hover:text-white hover:bg-white/5 font-medium transition">Login Akun</button>
                        <button onclick="window.navigateTo('user-register');" class="text-left px-4 py-3 rounded-xl text-gray-300 hover:text-white hover:bg-white/5 font-medium transition">Daftar Baru</button>
                    </div>
                `;
            }

            let html = `
                <div class="p-6 border-b border-white/10 flex justify-between items-center bg-black/20">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 rounded-xl ${state.isAdmin ? 'bg-blue-600 text-white' : 'bg-theme-accent text-white'} flex items-center justify-center font-bold text-lg shadow">
                            <i class="fa-solid ${state.isAdmin ? 'fa-shield-halved' : 'fa-user'}"></i>
                        </div>
                        <div>
                            <span class="block text-sm font-bold text-white truncate max-w-[150px]">${state.appUser.username}</span>
                            <span class="block text-xs text-gray-400">${state.isAdmin ? 'Administrator' : 'Member'}</span>
                        </div>
                    </div>
                    <button onclick="window.toggleSidebar()" class="text-gray-400 hover:text-white p-2 focus:outline-none"><i class="fa-solid fa-xmark text-xl"></i></button>
                </div>
                <div class="flex-grow py-4 flex flex-col overflow-y-auto px-4 space-y-1">
                    <button onclick="window.navigateTo('store');" class="text-left px-4 py-3 rounded-xl text-gray-300 hover:text-white hover:bg-white/5 font-medium flex items-center space-x-3 transition">
                        <i class="fa-solid fa-store w-5 text-center text-theme-accent"></i> <span>Katalog Toko</span>
                    </button>
                    <button onclick="window.navigateTo('profile');" class="text-left px-4 py-3 rounded-xl text-gray-300 hover:text-white hover:bg-white/5 font-medium flex items-center space-x-3 transition">
                        <i class="fa-solid fa-user-astronaut w-5 text-center text-blue-400"></i> <span>Profile Saya</span>
                    </button>
                    <button onclick="window.navigateTo('history');" class="text-left px-4 py-3 rounded-xl text-gray-300 hover:text-white hover:bg-white/5 font-medium flex items-center space-x-3 transition">
                        <i class="fa-solid fa-clock-rotate-left w-5 text-center text-theme-pink"></i> <span>Riwayat Pesanan</span>
                    </button>
                    <button onclick="window.navigateTo('snk');" class="text-left px-4 py-3 rounded-xl text-gray-300 hover:text-white hover:bg-white/5 font-medium flex items-center space-x-3 transition">
                        <i class="fa-solid fa-shield w-5 text-center text-yellow-400"></i> <span>Syarat & Ketentuan</span>
                    </button>
            `;

            if (state.isAdmin) {
                html += `
                    <div class="my-4 border-t border-white/10"></div>
                    <div class="px-4 py-2 text-xs font-black text-blue-400 uppercase tracking-widest">Admin Control</div>
                    <button onclick="window.state.adminSubView='appearance'; window.navigateTo('admin-dashboard');" class="text-left px-4 py-3 rounded-xl ${state.adminSubView==='appearance' && state.currentView==='admin-dashboard'?'bg-white/10 text-white font-bold':'text-gray-300 hover:bg-white/5'} transition flex items-center space-x-3">
                        <i class="fa-solid fa-palette w-5 text-center text-theme-accent"></i> <span>Tampilan Web</span>
                    </button>
                    <button onclick="window.state.adminSubView='products'; window.navigateTo('admin-dashboard');" class="text-left px-4 py-3 rounded-xl ${state.adminSubView==='products' && state.currentView==='admin-dashboard'?'bg-white/10 text-white font-bold':'text-gray-300 hover:bg-white/5'} transition flex items-center space-x-3">
                        <i class="fa-solid fa-boxes-stacked w-5 text-center text-emerald-400"></i> <span>Kelola Produk</span>
                    </button>
                    <button onclick="window.state.adminSubView='orders'; window.navigateTo('admin-dashboard');" class="text-left px-4 py-3 rounded-xl ${state.adminSubView==='orders' && state.currentView==='admin-dashboard'?'bg-white/10 text-white font-bold':'text-gray-300 hover:bg-white/5'} transition flex items-center space-x-3">
                        <i class="fa-solid fa-receipt w-5 text-center text-amber-400"></i> <span>Cek Pesanan</span>
                    </button>
                    <button onclick="window.state.adminSubView='promos'; window.navigateTo('admin-dashboard');" class="text-left px-4 py-3 rounded-xl ${state.adminSubView==='promos' && state.currentView==='admin-dashboard'?'bg-white/10 text-white font-bold':'text-gray-300 hover:bg-white/5'} transition flex items-center space-x-3">
                        <i class="fa-solid fa-ticket w-5 text-center text-theme-pink"></i> <span>Kode Promo</span>
                    </button>
                `;
            }

            html += `
                </div>
                <div class="p-4 border-t border-white/10">
                    <button onclick="window.logoutUser();" class="w-full text-left px-4 py-3 rounded-xl text-red-400 hover:bg-red-500/10 font-bold flex items-center space-x-3 transition">
                        <i class="fa-solid fa-right-from-bracket w-5 text-center"></i> <span>Keluar Akun</span>
                    </button>
                </div>
            `;
            return html;
        };

        window.renderUserLogin = () => {
            document.getElementById('app-container').innerHTML = `
                <div class="max-w-md mx-auto py-10">
                    <div class="solid-card rounded-3xl p-8 space-y-6">
                        <div class="text-center space-y-2">
                            <div class="w-16 h-16 rounded-2xl bg-theme-accent text-white font-black text-2xl flex items-center justify-center mx-auto mb-4 shadow-lg"><i class="fa-solid fa-cube"></i></div>

            try {

                    credentials: 'same-origin',

                if (!response.ok) throw new Error('Gagal membuat transaksi.');

        };

        window.confirmRestock = async (productId) => {
            const text = document.getElementById('restock-txt').value.trim();
            if (!text) return window.showToast("Data stok tidak boleh kosong!", "error");
            
            const product = state.products.find(p => p.id === productId);
            if (!product) return;
            
            const updatedStock = [...(product.stock || []), ...text.split('\n').map(s=>s.trim()).filter(Boolean)];
            
            if (isDbConnected) {
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'products', productId), { stock: updatedStock });
            } else {
                product.stock = updatedStock;
                window.renderAdminDashboard();
            }
            
            document.querySelector('.fixed.inset-0').remove();
            window.showToast(`Berhasil menambah ${text.split('\n').filter(Boolean).length} stok!`, "success");
        };

        window.createPromo = async () => {
            const code = document.getElementById('promo-name').value.trim().toUpperCase();
            const type = document.getElementById('promo-type').value;
            const value = parseFloat(document.getElementById('promo-value').value);
            
            if (!code || isNaN(value)) return window.showToast("Pastikan kode dan nilai terisi benar!", "error");
            
            const promo = { code, type, value };
            if (isDbConnected) {
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'promo_codes'), promo);
            } else {
                promo.id = 'promo-' + Date.now();
                state.promoCodes.push(promo);
                window.renderAdminDashboard();
            }
            window.showToast("Kode promo berhasil dibuat!", "success");
        };

        window.deletePromo = async (id) => {
            if (isDbConnected) {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'promo_codes', id));
            } else {
                state.promoCodes = state.promoCodes.filter(p => p.id !== id);
                window.renderAdminDashboard();
            }
            window.showToast("Kode promo dihapus", "success");
        };

        window.filterAdminOrders = (q) => {
            const list = document.getElementById('admin-orders-list');
            if(!list) return;
            const filtered = state.userOrders.filter(o => o.orderId.toLowerCase().includes(q.toLowerCase()));
            
            if (filtered.length === 0) {
                list.innerHTML = `<div class="text-gray-500 text-sm">Pesanan tidak ditemukan.</div>`;
                return;
            }
            
            list.innerHTML = filtered.map(o => `
                <div class="p-4 rounded-2xl bg-black/40 border border-white/10 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                    <div>
                        <span class="text-[10px] font-mono text-theme-accent font-bold tracking-widest">${o.orderId}</span>
                        <h4 class="font-bold text-white text-sm">${o.productName}</h4>
                    </div>
                    <span class="font-black text-white text-sm sm:text-base">${window.formatRp(o.price)}</span>
                </div>
            `).join('');
        };

        window.onload = initApp;
</script>
</body>
</html>
