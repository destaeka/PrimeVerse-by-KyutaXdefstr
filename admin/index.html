<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Primeverse Admin</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-[#070b14] text-white font-sans"><div id="app"></div><script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";import{getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
let auth,token,data={products:[],orders:[],promos:[],settings:{}};const $=s=>document.querySelector(s),rp=n=>new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(n||0),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));async function api(u,o={}){const h={"Content-Type":"application/json"};if(token)h.Authorization="Bearer "+token;const r=await fetch(u,{...o,headers:h}),d=await r.json();if(!r.ok)throw Error(d.error||"Gagal");return d}
function login(){document.body.innerHTML='<main class="min-h-screen grid place-items-center p-4"><div class="bg-[#0f172a] border border-slate-800 p-8 rounded-3xl w-full max-w-md"><h1 class="text-2xl font-black mb-5">Primeverse Admin</h1><input id="e" type="email" placeholder="Email" class="w-full bg-black/30 p-3 rounded-xl mb-3"><input id="p" type="password" placeholder="Password" class="w-full bg-black/30 p-3 rounded-xl mb-4"><button id="b" class="w-full bg-blue-600 p-3 rounded-xl font-bold">Masuk</button><p id="x" class="text-red-400 text-sm mt-3"></p></div></main>';$("#b").onclick=async()=>{try{const c=await signInWithEmailAndPassword(auth,$("#e").value,$("#p").value);token=await c.user.getIdToken(true);const t=await c.user.getIdTokenResult();if(t.claims.admin!==true)throw Error("Akun bukan admin");await load();render()}catch(e){$("#x").textContent=e.message}}}
async function load(){data=await api("/api/admin/data")}
function render(){const s=data.settings||{};document.body.innerHTML=`<header class="sticky top-0 bg-[#070b14]/95 border-b border-slate-800 p-4 flex justify-between"><b class="text-xl">Primeverse <span class="text-blue-400">Admin</span></b><button id=o class="text-red-400">Keluar</button></header><main class="max-w-6xl mx-auto p-4 space-y-5"><div class="grid sm:grid-cols-4 gap-3">${[["Produk",data.products.length],["Order",data.orders.length],["Paid",data.orders.filter(x=>["paid","fulfilled"].includes(x.status)).length],["Revenue",rp(data.orders.filter(x=>["paid","fulfilled"].includes(x.status)).reduce((a,x)=>a+Number(x.amount||0),0))]].map(x=>`<div class="bg-[#0f172a] border border-slate-800 p-5 rounded-2xl"><small class="text-slate-400">${x[0]}</small><div class="text-2xl font-black mt-2">${x[1]}</div></div>`).join("")}</div>
<section class="bg-[#0f172a] border border-slate-800 p-5 rounded-2xl"><div class="flex justify-between mb-4"><h2 class="text-xl font-black">Produk</h2><button id=np class="bg-blue-600 px-4 py-2 rounded-xl">+ Produk</button></div><div class="space-y-2">${data.products.map(p=>`<div class="bg-black/20 p-4 rounded-xl flex flex-wrap gap-2 justify-between items-center"><div><b>${esc(p.name)}</b><div class="text-slate-400 text-sm">${rp(p.price)} · stok ${(p.stock||[]).length} · ${p.active===false?"nonaktif":"aktif"}</div></div><div class="flex gap-2"><button data-e="${p.id}" class="bg-white/10 px-3 py-2 rounded-lg">Edit</button><button data-r="${p.id}" class="bg-emerald-600/20 text-emerald-300 px-3 py-2 rounded-lg">Restock</button><button data-d="${p.id}" class="bg-red-600/20 text-red-300 px-3 py-2 rounded-lg">Nonaktif</button></div></div>`).join("")}</div></section>
<section class="bg-[#0f172a] border border-slate-800 p-5 rounded-2xl"><h2 class="text-xl font-black mb-4">Stok Akun — Manual / TXT</h2><div class="grid md:grid-cols-3 gap-3"><select id="sp" class="bg-black/30 p-3 rounded-xl">${data.products.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("")}</select><input id="su" placeholder="Username / Email" class="bg-black/30 p-3 rounded-xl"><input id="sw" placeholder="Password" class="bg-black/30 p-3 rounded-xl"></div><div class="flex gap-2 mt-3"><button id="sa" class="bg-emerald-600 px-4 py-2 rounded-xl">Tambah Manual</button><input id="sf" type="file" accept=".txt,text/plain" class="bg-black/30 p-2 rounded-xl"></div><p class="text-xs text-slate-500 mt-3">TXT: satu akun per baris dengan format username|password. File dipreview dan divalidasi sebelum disimpan.</p><pre id="preview" class="hidden mt-3 bg-black/40 p-3 rounded-xl text-xs whitespace-pre-wrap"></pre><button id="si" class="hidden mt-3 bg-blue-600 px-4 py-2 rounded-xl">Import Hasil Preview</button></section><section class="bg-[#0f172a] border border-slate-800 p-5 rounded-2xl"><h2 class="text-xl font-black mb-4">Tampilan + Customer Service</h2><div class="grid sm:grid-cols-2 gap-3">${["logoText","logoIcon","bannerTitle","bannerDesc","bannerImage","themeColor","snkText","whatsapp","telegram","instagram","tiktok","footerText"].map(k=>`<label class="text-sm text-slate-300">${k}<input data-s="${k}" value="${esc(s[k]||"")}" class="mt-1 w-full bg-black/30 border border-slate-800 p-3 rounded-xl"></label>`).join("")}</div><button id=ss class="mt-4 bg-blue-600 px-5 py-3 rounded-xl font-bold">Simpan</button></section>
<section class="bg-[#0f172a] border border-slate-800 p-5 rounded-2xl"><h2 class="text-xl font-black mb-4">Promo</h2><div class="grid sm:grid-cols-3 gap-2"><input id=pc placeholder="KODE" class="bg-black/30 p-3 rounded-xl"><select id=pt class="bg-black/30 p-3 rounded-xl"><option value=percent>%</option><option value=flat>Rp</option></select><input id=pv type=number placeholder="Nilai" class="bg-black/30 p-3 rounded-xl"></div><button id=ps class="mt-3 bg-fuchsia-600 px-4 py-2 rounded-xl">Simpan Promo</button><div class="mt-3 space-y-2">${data.promos.map(p=>`<div class="flex justify-between bg-black/20 p-3 rounded-xl"><span>${esc(p.code)} · ${p.value}${p.type==="percent"?"%":""}</span><button data-p="${esc(p.code)}" class="text-red-300">Nonaktifkan</button></div>`).join("")}</div></section>
<section class="bg-[#0f172a] border border-slate-800 p-5 rounded-2xl"><h2 class="text-xl font-black mb-4">Order</h2><div class="space-y-2">${data.orders.map(o=>`<div class="bg-black/20 p-3 rounded-xl flex justify-between"><span><b>${esc(o.orderId)}</b><small class="block text-slate-400">${esc(o.productName||"")} · ${esc(o.status||"")}</small></span><b>${rp(o.amount)}</b></div>`).join("")}</div></section></main>`;
$("#o").onclick=()=>signOut(auth);$("#np").onclick=()=>form();document.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>form(data.products.find(x=>x.id===b.dataset.e)));document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{const x=prompt("Satu stok per baris");if(x)api("/api/admin/restock",{method:"POST",body:JSON.stringify({productId:b.dataset.r,items:x.split(/\\r?\\n/).filter(Boolean)})}).then(async()=>{await load();render()})});document.querySelectorAll("[data-d]").forEach(b=>b.onclick=async()=>{await api("/api/admin/product-delete",{method:"POST",body:JSON.stringify({id:b.dataset.d})});await load();render()});document.querySelectorAll("[data-p]").forEach(b=>b.onclick=async()=>{await api("/api/admin/promo-delete",{method:"POST",body:JSON.stringify({code:b.dataset.p})});await load();render()});$("#sa").onclick=async()=>{try{await api("/api/admin/stock-add",{method:"POST",body:JSON.stringify({productId:$("#sp").value,username:$("#su").value,password:$("#sw").value})});alert("Stok ditambahkan");await load();render()}catch(e){alert(e.message)}};let txt="";$("#sf").onchange=async e=>{const f=e.target.files[0];if(!f)return;txt=await f.text();const lines=txt.split(/\r?\n/).filter(x=>x.trim()&&!x.trim().startsWith("#"));const bad=lines.filter(x=>x.split("|").length<2);$("#preview").classList.remove("hidden");$("#preview").textContent=`Preview\\nBaris: ${lines.length}\\nValid: ${lines.length-bad.length}\\nError: ${bad.length}\\n\\n`+lines.slice(0,20).join("\\n");$("#si").classList.toggle("hidden",bad.length>0||lines.length===0)};$("#si").onclick=async()=>{try{const r=await api("/api/admin/stock-import",{method:"POST",body:JSON.stringify({productId:$("#sp").value,content:txt})});alert(`Import berhasil: ${r.imported} | Duplikat: ${r.duplicate}`);await load();render()}catch(e){alert(e.message)}};$("#ss").onclick=async()=>{let x={};document.querySelectorAll("[data-s]").forEach(i=>x[i.dataset.s]=i.value);await api("/api/admin/settings-save",{method:"POST",body:JSON.stringify(x)});alert("Tersimpan")};$("#ps").onclick=async()=>{await api("/api/admin/promo-save",{method:"POST",body:JSON.stringify({code:$("#pc").value,type:$("#pt").value,value:Number($("#pv").value)})});await load();render()}}
function form(p={}){const name=prompt("Nama produk",p.name||"");if(!name)return;const price=Number(prompt("Harga",p.price||5000));const desc=prompt("Deskripsi",p.description||"")||"";api("/api/admin/product-save",{method:"POST",body:JSON.stringify({id:p.id,name,price,description:desc,active:true})}).then(async()=>{await load();render()}).catch(e=>alert(e.message))}
(async()=>{const c=await(await fetch("/api/public-config")).json();auth=getAuth(initializeApp(c.firebaseConfig));onAuthStateChanged(auth,u=>{if(!u)login()})})()
</script></body></html>
